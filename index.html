<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D 공원 주차장 탈출 게임</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@700;900&display=swap');
        
        body {
            font-family: 'Pretendard', sans-serif;
            touch-action: none;
            user-select: none;
            overflow: hidden;
            background-color: #0f172a;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
        }
    </style>
</head>
<body class="text-white min-h-screen flex flex-col justify-between p-4 relative overflow-hidden">

    <!-- 3D Canvas Container -->
    <div id="canvas-container"></div>

    <!-- HUD Top Bar -->
    <header class="w-full max-w-lg mx-auto flex justify-between items-center bg-slate-900/90 backdrop-blur-md border border-slate-700/80 rounded-2xl p-3 shadow-2xl relative z-20 pointer-events-auto">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-emerald-400 font-black text-sm" id="hud-stage">
                ST 1
            </div>
            <div class="flex flex-col">
                <span class="text-[10px] text-slate-400 font-extrabold tracking-wider">REMAIN TIME</span>
                <span id="hud-timer" class="text-xl font-black text-amber-400 font-mono tracking-tight">60초</span>
            </div>
        </div>

        <div class="flex gap-4">
            <div class="flex flex-col items-end">
                <span class="text-[10px] text-slate-400 font-extrabold tracking-wider">MOVED TILES</span>
                <span id="hud-distance" class="text-xl font-black text-sky-400 font-mono">0칸</span>
            </div>
        </div>
    </header>

    <!-- HUD Bottom Action Bar -->
    <footer class="w-full max-w-lg mx-auto flex justify-between items-center gap-3 relative z-20 pointer-events-auto mb-2">
        <button id="btn-hammer" onclick="activateItemMode()" class="flex-1 bg-slate-900/90 backdrop-blur-md border border-amber-500/40 hover:border-amber-400 text-amber-400 py-3 rounded-2xl font-extrabold text-sm shadow-xl flex items-center justify-center gap-2 transition active:scale-95">
            <i class="fa-solid fa-wrench text-base"></i> 견인 망치 (<span id="item-count">1</span>)
        </button>
        <button onclick="resetStage()" class="bg-slate-900/90 backdrop-blur-md border border-slate-700 text-slate-300 px-4 py-3 rounded-2xl font-extrabold text-sm shadow-xl hover:bg-slate-800 transition active:scale-95 flex items-center justify-center gap-1.5">
            <i class="fa-solid fa-rotate-left text-xs"></i> 리셋
        </button>
    </footer>

    <!-- Game Start Overlay -->
    <div id="overlay-start" class="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-4">
        <div class="w-full max-w-sm bg-slate-900 border-2 border-emerald-500/40 rounded-3xl p-6 text-center shadow-2xl flex flex-col items-center">
            <div class="w-16 h-16 bg-emerald-500/20 rounded-2xl flex items-center justify-center text-3xl mb-3 border border-emerald-500/40 text-emerald-400 animate-bounce">
                🚗
            </div>
            <h2 class="text-2xl font-black text-white mb-1">3D 공원 주차장 탈출</h2>
            <p class="text-slate-400 text-xs mb-5 leading-relaxed">
                60초 안에 장애물 차량들을 밀어서<br>
                <strong class="text-rose-400">빨간색 스포츠카</strong>를 탈출구로 빼내세요!
            </p>
            <button onclick="startGame()" class="w-full py-3.5 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-black text-base rounded-2xl shadow-lg transition transform active:scale-95">
                게임 시작하기
            </button>
        </div>
    </div>

    <!-- Game Clear Overlay -->
    <div id="overlay-clear" class="hidden fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4">
        <div class="w-full max-w-sm bg-slate-900 border-2 border-amber-500/50 rounded-3xl p-6 text-center shadow-2xl flex flex-col items-center">
            <div class="text-5xl mb-2">🎉</div>
            <h2 class="text-2xl font-black text-amber-400 mb-1">주차장 탈출 성공!</h2>
            <p class="text-slate-300 text-xs mb-4">모든 난이도를 완벽하게 해결했습니다!</p>
            
            <div class="w-full bg-slate-950 border border-slate-800 rounded-2xl p-4 mb-5 flex justify-between items-center">
                <span class="text-slate-400 text-xs font-bold">총 이동한 거리</span>
                <span id="final-distance" class="font-black text-sky-400 text-xl font-mono">0칸</span>
            </div>

            <button onclick="restartGame()" class="w-full py-3.5 bg-amber-500 hover:bg-amber-600 text-slate-950 font-black text-base rounded-2xl shadow-lg transition transform active:scale-95">
                다시 도전하기
            </button>
        </div>
    </div>

    <!-- Game Engine & 3D Script -->
    <script>
        // 7x7 Board Settings
        const BOARD_SIZE = 7;
        const TILE_SIZE = 1.2;
        const OFFSET = (BOARD_SIZE * TILE_SIZE) / 2 - TILE_SIZE / 2;

        let scene, camera, renderer, raycaster, mouse;
        let vehicleMeshes = new Map();
        let currentStage = 1;
        let totalMovedTiles = 0;
        let timeLeft = 60;
        let timerInterval = null;
        let itemHammerCount = 1;
        let isItemActive = false;
        let vehicles = [];

        // Solvable 7x7 Stage Layouts
        const STAGES = {
            1: [
                { id: 'player', type: 'car', dir: 'H', row: 3, col: 1, len: 2, isPlayer: true },
                { id: 'v1', type: 'bike', dir: 'V', row: 1, col: 3, len: 1 },
                { id: 'v2', type: 'car', dir: 'V', row: 2, col: 3, len: 2 },
                { id: 'v3', type: 'bus', dir: 'H', row: 0, col: 1, len: 3 },
                { id: 'v4', type: 'car', dir: 'H', row: 5, col: 2, len: 2 },
                { id: 'v5', type: 'bus', dir: 'V', row: 2, col: 5, len: 3 },
                { id: 'v6', type: 'bike', dir: 'H', row: 4, col: 0, len: 1 }
            ],
            2: [
                { id: 'player', type: 'car', dir: 'H', row: 3, col: 0, len: 2, isPlayer: true },
                { id: 'v1', type: 'car', dir: 'V', row: 1, col: 2, len: 2 },
                { id: 'v2', type: 'bus', dir: 'H', row: 0, col: 3, len: 3 },
                { id: 'v3', type: 'car', dir: 'V', row: 3, col: 3, len: 2 },
                { id: 'v4', type: 'bike', dir: 'H', row: 5, col: 3, len: 1 },
                { id: 'v5', type: 'bus', dir: 'V', row: 1, col: 5, len: 3 },
                { id: 'v6', type: 'car', dir: 'H', row: 6, col: 1, len: 2 },
                { id: 'v7', type: 'car', dir: 'V', row: 4, col: 1, len: 2 }
            ],
            3: [
                { id: 'player', type: 'car', dir: 'H', row: 3, col: 1, len: 2, isPlayer: true },
                { id: 'v1', type: 'car', dir: 'V', row: 1, col: 1, len: 2 },
                { id: 'v2', type: 'bus', dir: 'H', row: 0, col: 2, len: 3 },
                { id: 'v3', type: 'car', dir: 'V', row: 1, col: 3, len: 2 },
                { id: 'v4', type: 'car', dir: 'V', row: 4, col: 3, len: 2 },
                { id: 'v5', type: 'bus', dir: 'V', row: 2, col: 4, len: 3 },
                { id: 'v6', type: 'car', dir: 'H', row: 5, col: 4, len: 2 },
                { id: 'v7', type: 'bike', dir: 'H', row: 6, col: 1, len: 1 },
                { id: 'v8', type: 'car', dir: 'V', row: 2, col: 0, len: 2 }
            ]
        };

        window.onload = function() {
            init3DScene();
            window.addEventListener('resize', onWindowResize);
            setupInteraction();
        };

        function init3DScene() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);

            // Isometric Camera Perspective
            const aspect = window.innerWidth / window.innerHeight;
            const d = 6;
            camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 0.1, 1000);
            camera.position.set(10, 12, 10);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            // Lighting Setup
            const ambient = new THREE.AmbientLight(0xffffff, 0.75);
            scene.add(ambient);

            const sun = new THREE.DirectionalLight(0xffffff, 0.6);
            sun.position.set(12, 20, 8);
            sun.castShadow = true;
            sun.shadow.mapSize.width = 2048;
            sun.shadow.mapSize.height = 2048;
            scene.add(sun);

            createParkEnvironment();
            animate();
        }

        function createParkEnvironment() {
            // Grass Base Ground
            const grassGeo = new THREE.BoxGeometry(16, 0.4, 16);
            const grassMat = new THREE.MeshStandardMaterial({ color: 0x22c55e, roughness: 0.9 });
            const grass = new THREE.Mesh(grassGeo, grassMat);
            grass.position.y = -0.3;
            grass.receiveShadow = true;
            scene.add(grass);

            // Asphalt Parking Lot Base
            const parkGeo = new THREE.BoxGeometry(BOARD_SIZE * TILE_SIZE + 0.4, 0.2, BOARD_SIZE * TILE_SIZE + 0.4);
            const parkMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.5 });
            const park = new THREE.Mesh(parkGeo, parkMat);
            park.position.y = -0.05;
            park.receiveShadow = true;
            scene.add(park);

            // Grid Parking Lines & Exit Gate
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const lineGeo = new THREE.BoxGeometry(TILE_SIZE - 0.08, 0.01, TILE_SIZE - 0.08);
                    const lineMat = new THREE.MeshBasicMaterial({ color: 0x475569 });
                    const tile = new THREE.Mesh(lineGeo, lineMat);
                    tile.position.set(c * TILE_SIZE - OFFSET, 0.06, r * TILE_SIZE - OFFSET);
                    scene.add(tile);
                }
            }

            // Red Exit Gate Indicator at Row 3 Exit
            const exitGeo = new THREE.BoxGeometry(0.8, 0.08, TILE_SIZE);
            const exitMat = new THREE.MeshStandardMaterial({ color: 0xf43f5e, emissive: 0x9f1239 });
            const exitGate = new THREE.Mesh(exitGeo, exitMat);
            exitGate.position.set((BOARD_SIZE - 0.1) * TILE_SIZE - OFFSET, 0.08, 3 * TILE_SIZE - OFFSET);
            scene.add(exitGate);
        }

        function loadStage(stageNum) {
            vehicleMeshes.forEach(mesh => scene.remove(mesh));
            vehicleMeshes.clear();

            vehicles = JSON.parse(JSON.stringify(STAGES[stageNum]));
            vehicles.forEach(v => create3DVehicle(v));

            document.getElementById('hud-stage').textContent = `ST ${stageNum}`;
        }

        function create3DVehicle(v) {
            const group = new THREE.Group();
            let color = 0x3b82f6; // Blue default
            let length = v.len * TILE_SIZE - 0.15;
            let width = TILE_SIZE - 0.25;

            if (v.isPlayer) color = 0xef4444; // Red player car
            else if (v.type === 'bike') color = 0xeab308; // Yellow bike
            else if (v.type === 'bus') color = 0x10b981; // Green bus

            // Vehicle Main Body Shell
            const bodyGeo = new THREE.BoxGeometry(v.dir === 'H' ? length : width, 0.5, v.dir === 'H' ? width : length);
            const bodyMat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.3, metalness: 0.2 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.3;
            body.castShadow = true;
            group.add(body);

            // Forward Lights (Headlights) facing East (H) or South (V)
            const lightGeo = new THREE.BoxGeometry(0.1, 0.1, 0.1);
            const lightMat = new THREE.MeshBasicMaterial({ color: 0xfef08a });
            
            if (v.dir === 'H') {
                const l1 = new THREE.Mesh(lightGeo, lightMat);
                l1.position.set(length / 2, 0.3, width / 3);
                const l2 = new THREE.Mesh(lightGeo, lightMat);
                l2.position.set(length / 2, 0.3, -width / 3);
                group.add(l1, l2);
            } else {
                const l1 = new THREE.Mesh(lightGeo, lightMat);
                l1.position.set(width / 3, 0.3, length / 2);
                const l2 = new THREE.Mesh(lightGeo, lightMat);
                l2.position.set(-width / 3, 0.3, length / 2);
                group.add(l1, l2);
            }

            group.userData = { id: v.id };
            updateMeshPosition(group, v);
            scene.add(group);
            vehicleMeshes.set(v.id, group);
        }

        function updateMeshPosition(group, v) {
            const x = (v.col + (v.dir === 'H' ? v.len / 2 - 0.5 : 0)) * TILE_SIZE - OFFSET;
            const z = (v.row + (v.dir === 'V' ? v.len / 2 - 0.5 : 0)) * TILE_SIZE - OFFSET;
            group.position.set(x, 0, z);
        }

        // Drag and Drop Raycasting Controllers
        let selectedVehicle = null;
        let dragPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
        let startCol = 0, startRow = 0;

        function setupInteraction() {
            const container = document.getElementById('canvas-container');

            container.addEventListener('pointerdown', (e) => {
                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(scene.children, true);

                if (intersects.length > 0) {
                    let obj = intersects[0].object;
                    while (obj.parent && obj.parent !== scene) obj = obj.parent;

                    const vId = obj.userData?.id;
                    if (vId) {
                        const v = vehicles.find(item => item.id === vId);
                        if (!v) return;

                        if (isItemActive) {
                            useHammerItem(v);
                            return;
                        }

                        selectedVehicle = v;
                        startCol = v.col;
                        startRow = v.row;
                    }
                }
            });

            container.addEventListener('pointermove', (e) => {
                if (!selectedVehicle) return;

                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);
                const intersectPoint = new THREE.Vector3();
                raycaster.ray.intersectPlane(dragPlane, intersectPoint);

                if (selectedVehicle.dir === 'H') {
                    let targetCol = Math.round((intersectPoint.x + OFFSET - (selectedVehicle.len / 2 - 0.5) * TILE_SIZE) / TILE_SIZE);
                    targetCol = Math.max(0, Math.min(BOARD_SIZE - selectedVehicle.len, targetCol));
                    tryMoveVehicle(selectedVehicle, selectedVehicle.row, targetCol);
                } else {
                    let targetRow = Math.round((intersectPoint.z + OFFSET - (selectedVehicle.len / 2 - 0.5) * TILE_SIZE) / TILE_SIZE);
                    targetRow = Math.max(0, Math.min(BOARD_SIZE - selectedVehicle.len, targetRow));
                    tryMoveVehicle(selectedVehicle, targetRow, selectedVehicle.col);
                }
            });

            const onPointerEnd = () => {
                if (selectedVehicle) {
                    const movedDistance = Math.abs(selectedVehicle.col - startCol) + Math.abs(selectedVehicle.row - startRow);
                    if (movedDistance > 0) {
                        totalMovedTiles += movedDistance;
                        document.getElementById('hud-distance').textContent = `${totalMovedTiles}칸`;
                    }
                    checkWinCondition();
                    selectedVehicle = null;
                }
            };

            container.addEventListener('pointerup', onPointerEnd);
            container.addEventListener('pointerleave', onPointerEnd);
        }

        function tryMoveVehicle(v, targetRow, targetCol) {
            const stepR = Math.sign(targetRow - v.row);
            const stepC = Math.sign(targetCol - v.col);

            let currR = v.row;
            let currC = v.col;

            while (currR !== targetRow || currC !== targetCol) {
                const nextR = currR + stepR;
                const nextC = currC + stepC;

                if (canOccupy(v, nextR, nextC)) {
                    currR = nextR;
                    currC = nextC;
                } else break;
            }

            v.row = currR;
            v.col = currC;
            const group = vehicleMeshes.get(v.id);
            if (group) updateMeshPosition(group, v);
        }

        function canOccupy(v, r, c) {
            for (let other of vehicles) {
                if (other.id === v.id) continue;

                const vCells = getOccupiedCells(r, c, v.len, v.dir);
                const oCells = getOccupiedCells(other.row, other.col, other.len, other.dir);

                for (let vc of vCells) {
                    for (let oc of oCells) {
                        if (vc.r === oc.r && vc.c === oc.c) return false;
                    }
                }
            }
            return true;
        }

        function getOccupiedCells(row, col, len, dir) {
            const cells = [];
            for (let i = 0; i < len; i++) {
                cells.push({
                    r: dir === 'V' ? row + i : row,
                    c: dir === 'H' ? col + i : col
                });
            }
            return cells;
        }

        function checkWinCondition() {
            const player = vehicles.find(v => v.isPlayer);
            if (player && player.col === BOARD_SIZE - player.len && player.row === 3) {
                if (currentStage < 3) {
                    currentStage++;
                    loadStage(currentStage);
                } else {
                    finishGame();
                }
            }
        }

        function activateItemMode() {
            if (itemHammerCount <= 0) return;
            isItemActive = !isItemActive;
            const btn = document.getElementById('btn-hammer');
            if (isItemActive) btn.classList.add('bg-amber-500', 'text-slate-950');
            else btn.classList.remove('bg-amber-500', 'text-slate-950');
        }

        function useHammerItem(v) {
            if (v.isPlayer) return;
            scene.remove(vehicleMeshes.get(v.id));
            vehicleMeshes.delete(v.id);
            vehicles = vehicles.filter(item => item.id !== v.id);

            itemHammerCount--;
            document.getElementById('item-count').textContent = itemHammerCount;
            isItemActive = false;
            document.getElementById('btn-hammer').classList.remove('bg-amber-500', 'text-slate-950');
        }

        function startGame() {
            document.getElementById('overlay-start').classList.add('hidden');
            document.getElementById('overlay-clear').classList.add('hidden');

            currentStage = 1;
            totalMovedTiles = 0;
            timeLeft = 60;
            itemHammerCount = 1;

            document.getElementById('hud-distance').textContent = '0칸';
            document.getElementById('item-count').textContent = itemHammerCount;

            loadStage(currentStage);

            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('hud-timer').textContent = `${timeLeft}초`;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    alert('시간 초과! 다시 도전해 보세요.');
                    startGame();
                }
            }, 1000);
        }

        function finishGame() {
            clearInterval(timerInterval);
            document.getElementById('overlay-clear').classList.remove('hidden');
            document.getElementById('final-distance').textContent = `${totalMovedTiles}칸`;
        }

        function restartGame() {
            startGame();
        }

        function resetStage() {
            loadStage(currentStage);
        }

        function onWindowResize() {
            const aspect = window.innerWidth / window.innerHeight;
            const d = 6;
            camera.left = -d * aspect;
            camera.right = d * aspect;
            camera.top = d;
            camera.bottom = -d;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
